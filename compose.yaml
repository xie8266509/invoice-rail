name: invoice-rail

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_rail}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_rail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - invoice-rail-postgres:/var/lib/postgresql/data

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_ARC_RPC_URL: ${NEXT_PUBLIC_ARC_RPC_URL:-https://rpc.testnet.arc.network}
    image: invoice-rail:local
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_rail}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-invoice_rail}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      INDEXER_SECRET: ${INDEXER_SECRET:?Set INDEXER_SECRET in .env.docker}
      NEXT_PUBLIC_ARC_RPC_URL: ${NEXT_PUBLIC_ARC_RPC_URL:-https://rpc.testnet.arc.network}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "3000:3000"

  worker:
    image: invoice-rail:local
    restart: unless-stopped
    command:
      - node
      - scripts/run-indexer.mjs
    environment:
      INVOICE_RAIL_APP_URL: http://web:3000
      INDEXER_SECRET: ${INDEXER_SECRET:?Set INDEXER_SECRET in .env.docker}
      INDEXER_INTERVAL_MS: ${INDEXER_INTERVAL_MS:-5000}
    depends_on:
      web:
        condition: service_healthy

volumes:
  invoice-rail-postgres:
